name: gem

# Build seven platforms on tags, manual dispatch, and PRs that change this workflow.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only, without publishing"
        type: boolean
        default: true
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/gem.yml"]

jobs:
  cross-gem:
    name: build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - arm64-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # The repository root is mounted into the rb-sys-dock container, so the ext crate's `../../../../core` path dependency resolves
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          working-directory: bindings/ruby
          # Bundle one extension per supported Ruby ABI and restrict the gem to that range.
          ruby-versions: "3.4,4.0"
      - name: Show the bundled Ruby ABIs
        run: |
          gem=$(find bindings/ruby/pkg -name '*-${{ matrix.platform }}.gem')
          echo "### $(basename "$gem")" >> "$GITHUB_STEP_SUMMARY"
          ruby -rrubygems/package -e '
            spec = Gem::Package.new(ARGV[0]).spec
            abis = spec.files.grep(%r{\Alib/sghtmltopdf/(\d+\.\d+)/sghtmltopdf\.(?:so|bundle|dll)\z}) { Regexp.last_match(1) }.uniq.sort
            puts "- platform: #{spec.platform}"
            puts "- ruby ABI: #{abis.empty? ? "(none)" : abis.join(", ")}"
            puts "- required_ruby_version: #{spec.required_ruby_version}"
          ' "$gem" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: bindings/ruby/pkg/*-${{ matrix.platform }}.gem
          if-no-files-found: error

  # x86_64-linux: install directly on the runner
  smoke-linux:
    needs: cross-gem
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gem-x86_64-linux
          path: pkg
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: gem install and convert
        run: |
          gem install --no-document ./pkg/*.gem
          ruby bindings/ruby/script/smoke.rb

  # aarch64-linux: run an arm64 container under QEMU
  smoke-linux-arm64:
    needs: cross-gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gem-aarch64-linux
          path: pkg
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: gem install and convert (linux/arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/work" -w /work ruby:3.4-slim \
            bash -c '
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends fonts-dejavu-core
              rm -rf /var/lib/apt/lists/*
              gem install --no-document ./pkg/*.gem
              ruby bindings/ruby/script/smoke.rb
            '

  # arm64-darwin: the macOS runner is Apple Silicon
  smoke-macos-arm64:
    needs: cross-gem
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gem-arm64-darwin
          path: pkg
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: gem install and convert
        run: |
          gem install --no-document ./pkg/*.gem
          ruby bindings/ruby/script/smoke.rb
